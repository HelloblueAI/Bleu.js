# Generic example for running the open-source Bleu.js image.
# Not a production capacity plan. Set your own ports, replicas, and resource limits.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      # Set ENV_NAME=production only after SECRET_KEY, JWT_SECRET_KEY,
      # JWT_SECRET, and ENCRYPTION_KEY are set to your own values.
    restart: unless-stopped
