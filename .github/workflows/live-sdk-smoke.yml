name: Live SDK Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: live-sdk-smoke
  cancel-in-progress: false

jobs:
  pypi-sdk-smoke:
    name: PyPI SDK live API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BLEUJS_API_KEY: ${{ secrets.BLEUJS_API_KEY || secrets.BLEUJS_PYTHON }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install published SDK in clean venv
        run: |
          python -m venv .venv-smoke
          . .venv-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install bleu-js
          python -m pip show bleu-js

      - name: Verify imports and CLI entry points
        run: |
          . .venv-smoke/bin/activate
          python -c "import bleujs; from bleujs.api_client import BleuAPIClient; from bleujs import BleuJS; print('imports ok')"
          bleu version
          bleujs version

      - name: Exercise live API from published SDK
        run: |
          if [ -z "$BLEUJS_API_KEY" ]; then
            echo "Set BLEUJS_API_KEY or BLEUJS_PYTHON repository secret for live SDK smoke tests."
            exit 1
          fi

          . .venv-smoke/bin/activate
          python - <<'PY'
          import os
          import sys
          from bleujs.api_client import BleuAPIClient

          challenge_markers = (
              "Just a moment",
              "Enable JavaScript and cookies to continue",
              "challenges.cloudflare.com",
              "__cf_chl_",
              "cf-mitigated",
          )

          def fail_if_challenge(payload) -> None:
              text = payload if isinstance(payload, str) else str(payload)
              lowered = text.lower()
              if "<html" in lowered or any(marker.lower() in lowered for marker in challenge_markers):
                  print("FAIL: API returned a Cloudflare challenge or HTML instead of JSON.")
                  print(text[:500])
                  sys.exit(1)

          client = BleuAPIClient(api_key=os.environ["BLEUJS_API_KEY"], timeout=30)
          try:
              health = client.health()
              models = client.list_models()
          except Exception as exc:
              fail_if_challenge(str(exc))
              print(f"FAIL: live API request failed: {exc}")
              sys.exit(1)

          fail_if_challenge(health)
          fail_if_challenge(models)
          if not isinstance(health, dict) or "status" not in health:
              print("FAIL: health response is missing the expected schema.")
              print(health)
              sys.exit(1)
          print("health:", health)
          print("models:", models)
          PY
