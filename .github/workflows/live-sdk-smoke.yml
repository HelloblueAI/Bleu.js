name: Live SDK Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: live-sdk-smoke
  cancel-in-progress: false

jobs:
  pypi-sdk-smoke:
    name: PyPI SDK live API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BLEUJS_API_KEY: ${{ secrets.BLEUJS_API_KEY || secrets.BLEUJS_PYTHON }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install published SDK in clean venv
        run: |
          python -m venv .venv-smoke
          . .venv-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install bleu-js
          python -m pip show bleu-js

      - name: Verify imports and CLI entry points
        run: |
          . .venv-smoke/bin/activate
          python -c "import bleujs; from bleujs.api_client import BleuAPIClient; from bleujs import BleuJS; print('imports ok')"
          bleu version
          bleujs version

      - name: Exercise live API from published SDK
        run: |
          if [ -z "$BLEUJS_API_KEY" ]; then
            echo "Set BLEUJS_API_KEY or BLEUJS_PYTHON repository secret for live SDK smoke tests."
            exit 1
          fi

          . .venv-smoke/bin/activate
          python - <<'PY'
          import os
          import sys

          import httpx
          from bleujs.api_client import BleuAPIClient
          from bleujs.api_client.constants import (
              DEFAULT_BASE_URL,
              ENDPOINT_CHAT,
              ENDPOINT_EMBED,
              ENDPOINT_GENERATE,
          )

          challenge_markers = (
              "Just a moment",
              "Enable JavaScript and cookies to continue",
              "challenges.cloudflare.com",
              "__cf_chl_",
              "cf-mitigated",
          )

          def fail_if_challenge(payload) -> None:
              text = payload if isinstance(payload, str) else str(payload)
              lowered = text.lower()
              if "<html" in lowered or any(marker.lower() in lowered for marker in challenge_markers):
                  print("FAIL: API returned a Cloudflare challenge or HTML instead of JSON.")
                  print(text[:500])
                  sys.exit(1)

          api_key = os.environ["BLEUJS_API_KEY"]

          def redact(value) -> str:
              return str(value).replace(api_key, "[redacted]")

          def post_json(endpoint: str, payload: dict) -> dict:
              response = httpx.post(
                  DEFAULT_BASE_URL.rstrip("/") + endpoint,
                  headers={"Authorization": f"Bearer {api_key}", "Accept": "application/json"},
                  json=payload,
                  timeout=20,
              )
              if response.status_code != 200:
                  print(f"FAIL: {endpoint} returned HTTP {response.status_code}")
                  fail_if_challenge(redact(response.text[:300]))
                  sys.exit(1)
              if "json" not in response.headers.get("content-type", "").lower():
                  print(f"FAIL: {endpoint} did not return JSON")
                  fail_if_challenge(redact(response.text[:300]))
                  sys.exit(1)
              if not response.content:
                  print(f"FAIL: {endpoint} returned an empty body")
                  sys.exit(1)
              try:
                  body = response.json()
              except Exception:
                  print(f"FAIL: {endpoint} body is not valid JSON")
                  sys.exit(1)
              fail_if_challenge(redact(body))
              return body

          try:
              post_json(ENDPOINT_CHAT, {"messages": [{"role": "user", "content": "Say hi"}], "max_tokens": 8})
              post_json(ENDPOINT_GENERATE, {"prompt": "Say hi", "max_tokens": 8})
              post_json(ENDPOINT_EMBED, {"input": ["hi"]})
          except httpx.TimeoutException:
              print("FAIL: live API request timed out")
              sys.exit(1)
          except Exception as exc:
              fail_if_challenge(redact(exc))
              print(f"FAIL: live API request failed: {redact(exc)}")
              sys.exit(1)

          client = BleuAPIClient(api_key=api_key, timeout=20)
          try:
              health = client.health()
              models = client.list_models()
              chat = client.chat(
                  [{"role": "user", "content": "Say hi"}],
                  max_tokens=8,
              )
              generated = client.generate("Say hi", max_tokens=8)
              embedded = client.embed(["hi"])
          except Exception as exc:
              fail_if_challenge(redact(exc))
              print(f"FAIL: live API request failed: {redact(exc)}")
              sys.exit(1)

          fail_if_challenge(redact(health))
          fail_if_challenge(redact(models))
          fail_if_challenge(redact(chat))
          fail_if_challenge(redact(generated))
          fail_if_challenge(redact(embedded))
          if not isinstance(health, dict) or "status" not in health:
              print("FAIL: health response is missing the expected schema.")
              sys.exit(1)
          if not getattr(chat, "id", None) or not getattr(chat, "model", None) or not chat.choices:
              print("FAIL: chat response is missing id, model, or choices.")
              sys.exit(1)
          if not isinstance(chat.content, str) or not chat.content.strip():
              print("FAIL: chat response has no content.")
              sys.exit(1)
          if not generated.id or not generated.model or not isinstance(generated.text, str) or not generated.text.strip():
              print("FAIL: generate response is missing id, model, or text.")
              sys.exit(1)
          if not embedded.model or not embedded.data or not embedded.embeddings or not embedded.embeddings[0]:
              print("FAIL: embed response is missing model, data, or embeddings.")
              sys.exit(1)
          print("health status:", health.get("status"))
          print("models type:", type(models).__name__)
          print("chat id prefix:", str(chat.id)[:8], "content length:", len(chat.content))
          print("generate id prefix:", str(generated.id)[:8], "text length:", len(generated.text))
          print("embed dimensions:", len(embedded.embeddings[0]))
          PY
