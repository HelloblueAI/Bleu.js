name: Auto Assign
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize]
jobs:
  run:
    runs-on: ubuntu-24.04
    # Fork PR tokens are read-only, so attempting to assign them fails with
    # "Resource not accessible by integration". Keep issue and same-repo PR
    # assignment active while avoiding noisy red checks on external PRs.
    if: >
      github.actor != 'dependabot[bot]' &&
      (
        github.event_name == 'issues' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Assign the maintainer unless already assigned
        uses: actions/github-script@v8
        with:
          script: |
            const login = "pejmantheory";
            const current = context.payload.pull_request?.assignees
              || context.payload.issue?.assignees
              || [];
            if (current.some((person) => person.login === login)) {
              core.info(`${login} is already assigned`);
              return;
            }
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [login],
            });
