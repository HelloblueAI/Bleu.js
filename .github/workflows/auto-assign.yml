name: Auto Assign
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
jobs:
  run:
    runs-on: ubuntu-24.04
    # Fork PR tokens are read-only, so attempting to assign them fails with
    # "Resource not accessible by integration". Keep issue and same-repo PR
    # assignment active while avoiding noisy red checks on external PRs.
    if: >
      github.actor != 'dependabot[bot]' &&
      (
        github.event_name == 'issues' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: 'Auto-assign issue'
        uses: pozil/auto-assign-issue@v4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: pejmantheory
          numOfAssignee: 1
